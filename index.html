<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mapa de Restaurantes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
body { margin:0; display:flex; font-family:"Segoe UI", sans-serif; height:100vh; }
#sidebar { width:320px; max-width:80vw; background:linear-gradient(180deg,#fff,#f2f2f2); padding:20px; border-right:1px solid #ddd; overflow-y:auto; transition:margin-left 0.4s; z-index:100; }
#sidebar.hidden { margin-left:-320px; }
#sidebar h2 { margin-top:0;color:#e63946; }
input,select,button { width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; margin-bottom:10px; }
button { cursor:pointer; }
.restaurant-item { padding:8px; cursor:pointer; border-radius:6px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
.restaurant-item:hover { background:#e63946; color:white; }
.restaurant-item span { font-size:16px; margin-left:5px; }
#map { flex-grow:1; height:100vh; transition: margin-left 0.4s, width 0.4s; }
#map.full { margin-left:0; width:100vw; }

/* Botones flotantes */
#locateBtn,#addRestaurantBtn,#toggleSidebar { position:absolute; z-index:1000; border-radius:50%; width:50px; height:50px; font-size:22px; border:none; color:white; display:flex; justify-content:center; align-items:center; }
#locateBtn { bottom:20px; right:20px; background:#1d3557; }
#locateBtn:hover { background:#457b9d; }
#addRestaurantBtn { bottom:80px; right:20px; background:#e63946; }
#addRestaurantBtn:hover { background:#c92c3a; }
#toggleSidebar { top:20px; left:20px; background:#1d3557; }
#toggleSidebar:hover { background:#457b9d; }

/* Modal */
#modalOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:2000; }
#modal { background:#fff; padding:20px; border-radius:12px; width:320px; max-width:90vw; box-shadow:0 0 20px rgba(0,0,0,0.3); animation:fadeIn 0.3s; }
@keyframes fadeIn { from {opacity:0; transform:scale(0.9);} to {opacity:1; transform:scale(1);} }
#modal h3 { margin-top:0; color:#e63946; text-align:center; }
.modal-input { margin-bottom:10px; width:100%; }
#starContainer span, .popup-star { font-size:24px; cursor:pointer; margin-right:3px; transition: transform 0.2s; }
#starContainer span:hover, #starContainer span.active, .popup-star.active { color:#e63946; transform:scale(1.3); }
#modal button { margin-top:10px; width:48%; margin-right:2%; }
#modal button:last-child { margin-right:0; }

/* Popup estilos */
.popup-content { display:flex; flex-direction:column; font-size:14px; }
.popup-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }

/* Label sobre marcador */
.marker-label { background: rgba(255,255,255,0.9); border-radius: 4px; padding: 2px 6px; font-size: 12px; font-weight: bold; color:#e63946; white-space: nowrap; pointer-events:none; text-align:center; }
/* Hover animación marcador */
.custom-marker div { transition: transform 0.2s; }
.custom-marker-hover div { transform: scale(1.5); }

/* Responsive para móvil */
@media (max-width: 600px) {
    #sidebar { width:250px; }
    #sidebar.hidden { margin-left:-250px; }
    #toggleSidebar { top:10px; left:10px; width:40px; height:40px; font-size:20px; }
    #locateBtn,#addRestaurantBtn { width:40px; height:40px; font-size:18px; }
}
</style>
</head>
<body>

<div id="sidebar">
<h2>Restaurantes</h2>
<input type="text" id="search" placeholder="Buscar por nombre">
<input list="categorias" id="categoryFilter" class="modal-input" placeholder="Filtrar por categoría">
<datalist id="categorias">
  <option value="pizza">Pizza 🍕</option>
  <option value="japonesa">Japonesa 🍣</option>
  <option value="tapas">Tapas 🍤</option>
  <option value="hamburguesas">Hamburguesas 🍔</option>
</datalist>
<hr>
<div id="restaurantList"></div>
</div>

<div id="map"></div>
<button id="locateBtn">📍</button>
<button id="addRestaurantBtn">➕</button>
<button id="toggleSidebar">☰</button>

<!-- MODAL -->
<div id="modalOverlay">
<div id="modal">
<h3>Añadir Restaurante</h3>
<input id="modalName" class="modal-input" placeholder="Nombre">
<input list="categorias" id="modalCategoryInput" class="modal-input" placeholder="Categoría">
<input id="modalDesc" class="modal-input" placeholder="Descripción">
<div id="starContainer" class="modal-input">
    <span data-value="1">☆</span>
    <span data-value="2">☆</span>
    <span data-value="3">☆</span>
    <span data-value="4">☆</span>
    <span data-value="5">☆</span>
</div>
<button id="modalSave">Guardar</button>
<button id="modalCancel">Cancelar</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC27QBP2YOCglfsZGpGYS17qFA78njnLxY",
  authDomain: "mapa-restaurantes-c9088.firebaseapp.com",
  projectId: "mapa-restaurantes-c9088",
  storageBucket: "mapa-restaurantes-c9088.firebasestorage.app",
  messagingSenderId: "955158336278",
  appId: "1:955158336278:web:26c360d64f8b09f6933637"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ---------- VARIABLES GLOBALES ----------
let restaurantes=[], markers={}, labels={}, userMarker=null;
const iconos={ pizza:"🍕", japonesa:"🍣", tapas:"🍤", hamburguesas:"🍔" };
const colores={ pizza:"#ff6347", japonesa:"#1e90ff", tapas:"#ffa500", hamburguesas:"#32cd32" };

const map=L.map("map").setView([40.4167,-3.70325],14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{ attribution:"© OpenStreetMap" }).addTo(map);

const search=document.getElementById("search");
const categoryFilter=document.getElementById("categoryFilter");
const categoryInput=document.getElementById("modalCategoryInput");
const listEl=document.getElementById("restaurantList");
const locateBtn=document.getElementById("locateBtn");
const addBtn=document.getElementById("addRestaurantBtn");
const toggleSidebarBtn=document.getElementById("toggleSidebar");
const sidebar=document.getElementById("sidebar");

const modalOverlay=document.getElementById("modalOverlay");
const modalName=document.getElementById("modalName");
const modalDesc=document.getElementById("modalDesc");
const starContainer=document.getElementById("starContainer");
const modalSave=document.getElementById("modalSave");
const modalCancel=document.getElementById("modalCancel");

let modoAgregar=false, coordsAgregar=[0,0], ratingSeleccionado=5;

// ---------- FUNCIONES ----------
function getColor(categoria){
    if(!colores[categoria]) colores[categoria]="#"+Math.floor(Math.random()*16777215).toString(16);
    return colores[categoria];
}

function cargarMarcadores(lista){
    Object.values(markers).forEach(m=>map.removeLayer(m));
    Object.values(labels).forEach(l=>map.removeLayer(l));
    lista.forEach(r=>{
        const color=getColor(r.categoria);
        const markerIcon=L.divIcon({className:"custom-marker", html:`<div style="background:${color}; width:20px; height:20px; border-radius:50%; border:2px solid white;"></div>`, iconAnchor:[10,10]});
        const m=L.marker(r.coords,{icon:markerIcon}).addTo(map);

        m.on("mouseover",()=>{ m.getElement().classList.add("custom-marker-hover"); m.bindTooltip(r.categoria,{permanent:false,direction:"top"}).openTooltip(); });
        m.on("mouseout",()=>{ m.getElement().classList.remove("custom-marker-hover"); m.closeTooltip(); });

        const l=L.marker(r.coords,{icon:L.divIcon({className:"marker-label",html:r.nombre,iconAnchor:[0,-15]}),interactive:false}).addTo(map);

        const popup=document.createElement("div"); popup.className="popup-content";
        const top=document.createElement("div"); top.className="popup-top";
        const nombre=document.createElement("span"); nombre.textContent=`${iconos[r.categoria]||""} ${r.nombre}`; top.appendChild(nombre);

        const starsDiv=document.createElement("div");
        for(let i=1;i<=5;i++){
            const s=document.createElement("span"); s.innerHTML="☆"; s.classList.add("popup-star");
            if(i<=r.rating) s.classList.add("active");
            s.dataset.value=i;
            s.onclick=async (e)=>{ e.stopPropagation(); await updateDoc(doc(db,"restaurantes",r.id), { rating:i }); };
            starsDiv.appendChild(s);
        }
        top.appendChild(starsDiv);

        const categoria=document.createElement("i"); categoria.textContent=r.categoria;
        const desc=document.createElement("div"); desc.textContent=r.descripcion;

        const delBtn=document.createElement("button"); delBtn.textContent="Eliminar"; delBtn.style.marginTop="5px";
        delBtn.onclick=async (e)=>{ e.stopPropagation(); if(confirm(`Eliminar ${r.nombre}?`)) await deleteDoc(doc(db,"restaurantes",r.id)); };

        popup.appendChild(top); popup.appendChild(categoria); popup.appendChild(desc); popup.appendChild(delBtn);
        m.bindPopup(popup);

        markers[r.id]=m; labels[r.id]=l;
    });
}

function renderLista(lista){
    listEl.innerHTML="";
    lista.forEach(r=>{
        const div=document.createElement("div");
        div.className="restaurant-item";
        div.innerHTML=`<span>${iconos[r.categoria]||""} ${r.nombre}</span>
                       <button style="background:none;border:none;cursor:pointer;">🗑</button>`;
        div.querySelector("button").onclick=async (e)=>{
            e.stopPropagation();
            if(confirm(`Eliminar ${r.nombre}?`)) await deleteDoc(doc(db,"restaurantes",r.id));
        };
        div.onclick=()=>{ map.setView(r.coords,17); markers[r.id].openPopup(); };
        listEl.appendChild(div);
    });
}

function filtrar(){
    const texto=search.value.toLowerCase();
    const cat=categoryFilter.value.toLowerCase();
    const filtrados = restaurantes.filter(r=>r.nombre.toLowerCase().includes(texto) && (cat==="" || r.categoria.toLowerCase()===cat));
    cargarMarcadores(filtrados);
    renderLista(filtrados);
}

// ---------- EVENTOS ----------
search.oninput=filtrar;
categoryFilter.oninput=filtrar;

toggleSidebarBtn.onclick=()=>{
    sidebar.classList.toggle("hidden");
    const fullMap = sidebar.classList.contains("hidden");
    map.getContainer().classList.toggle("full", fullMap);
    setTimeout(()=>map.invalidateSize(),400);
};

locateBtn.onclick=()=>{
    if(!navigator.geolocation){ alert("Tu navegador no soporta geolocalización"); return; }
    navigator.geolocation.getCurrentPosition(pos=>{
        const latlng=[pos.coords.latitude,pos.coords.longitude];
        map.setView(latlng,16);
        if(userMarker) userMarker.setLatLng(latlng);
        else{ const blueIcon=L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/684/684908.png',iconSize:[32,32],iconAnchor:[16,32]}); userMarker=L.marker(latlng,{icon:blueIcon}).addTo(map);}
    },()=>{alert("No se pudo obtener tu ubicación");});
};

// Modal estrellas
Array.from(starContainer.children).forEach(span=>{
    span.onclick=()=>{
        ratingSeleccionado=parseInt(span.dataset.value);
        Array.from(starContainer.children).forEach(s=>s.classList.remove("active"));
        Array.from(starContainer.children).forEach(s=>{ if(parseInt(s.dataset.value)<=ratingSeleccionado) s.classList.add("active"); });
    };
});

// Añadir restaurante
addBtn.onclick=()=>{ modoAgregar=true; alert("Haz clic en el mapa para colocar el restaurante"); };
map.on("click",async e=>{
    if(!modoAgregar) return;
    coordsAgregar=[e.latlng.lat,e.latlng.lng];
    modalOverlay.style.display="flex";
});

// Guardar / cancelar modal
modalSave.onclick=async ()=>{
    const cat=categoryInput.value||categoryInput.placeholder;
    if(cat && !document.querySelector(`#categorias option[value="${cat}"]`)){
        const opt=document.createElement("option"); opt.value=cat; document.getElementById("categorias").appendChild(opt);
    }
    const nuevo={nombre:modalName.value||"Sin nombre",categoria:cat,descripcion:modalDesc.value,rating:ratingSeleccionado,coords:coordsAgregar};
    await addDoc(collection(db,"restaurantes"),nuevo);
    modalOverlay.style.display="none";
    modalName.value=""; modalDesc.value=""; ratingSeleccionado=5;
    Array.from(starContainer.children).forEach(s=>s.classList.remove("active"));
    modoAgregar=false;
};
modalCancel.onclick=()=>{ modalOverlay.style.display="none"; modoAgregar=false; };

// ---------- FIRESTORE EN TIEMPO REAL ----------
onSnapshot(collection(db,"restaurantes"), snapshot=>{
    restaurantes=[];
    snapshot.forEach(doc=>restaurantes.push({id:doc.id,...doc.data()}));
    filtrar();
});
</script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</body>
</html>
