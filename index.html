<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mapa de Restaurantes</title>

    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            display: flex;
            font-family: "Segoe UI", sans-serif;
        }

        /* Panel lateral */
        #sidebar {
            width: 300px;
            background: linear-gradient(180deg, #ffffff, #f2f2f2);
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        #sidebar h2 {
            margin-top: 0;
            color: #e63946;
        }

        #search, #categoryFilter {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        .restaurant-item {
            padding: 8px;
            cursor: pointer;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .restaurant-item:hover {
            background: #e63946;
            color: white;
        }

        /* Mapa */
        #map {
            flex-grow: 1;
            height: 100vh;
        }

        /* Botón ubicación */
        #locateBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: #1d3557;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 22px;
            cursor: pointer;
        }

        #locateBtn:hover {
            background: #457b9d;
        }
    </style>
</head>
<body>

    <!-- PANEL LATERAL -->
    <div id="sidebar">
        <h2>Restaurantes</h2>

        <input type="text" id="search" placeholder="Buscar por nombre...">

        <select id="categoryFilter">
            <option value="">Todas</option>
            <option value="pizza">Pizza</option>
            <option value="japonesa">Japonesa</option>
            <option value="tapas">Tapas</option>
            <option value="hamburguesas">Hamburguesas</option>
        </select>

        <div id="restaurantList"></div>
    </div>

    <!-- MAPA -->
    <div id="map"></div>

    <!-- BOTÓN UBICACIÓN -->
    <button id="locateBtn">📍</button>

    <!-- JS de Leaflet -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        /* ==========================
           1. DATOS DE RESTAURANTES
           ========================== */
        const restaurantes = [
            {
                id: 1,
                nombre: "Pizzería Don Luca",
                categoria: "pizza",
                descripcion: "Auténtica pizza napolitana.",
                coords: [40.4167, -3.70325]
            },
            {
                id: 2,
                nombre: "Sakura Sushi",
                categoria: "japonesa",
                descripcion: "Sushi fresco y ramen casero.",
                coords: [40.4183, -3.70577]
            },
            {
                id: 3,
                nombre: "Bar La Esquina",
                categoria: "tapas",
                descripcion: "Tapas tradicionales españolas.",
                coords: [40.4155, -3.7074]
            },
            {
                id: 4,
                nombre: "Burger House",
                categoria: "hamburguesas",
                descripcion: "Hamburguesas gourmet.",
                coords: [40.4178, -3.7025]
            }
        ];

        /* ==========================
           2. MAPA
           ========================== */
        const map = L.map("map").setView([40.4167, -3.70325], 14);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap"
        }).addTo(map);

        const markers = {};

        function cargarMarcadores(lista) {
            Object.values(markers).forEach(m => map.removeLayer(m));

            lista.forEach(rest => {
                const marker = L.marker(rest.coords).addTo(map);
                marker.bindPopup(`
                    <b>${rest.nombre}</b><br>
                    <i>${rest.categoria}</i><br>
                    ${rest.descripcion}
                `);
                markers[rest.id] = marker;
            });
        }

        cargarMarcadores(restaurantes);

        /* ==========================
           3. LISTA LATERAL
           ========================== */
        const listEl = document.getElementById("restaurantList");

        function renderLista(lista) {
            listEl.innerHTML = "";

            lista.forEach(rest => {
                const div = document.createElement("div");
                div.className = "restaurant-item";
                div.textContent = `${rest.nombre} (${rest.categoria})`;

                div.onclick = () => {
                    map.setView(rest.coords, 17);
                    markers[rest.id].openPopup();
                };

                listEl.appendChild(div);
            });
        }

        renderLista(restaurantes);

        /* ==========================
           4. FILTROS
           ========================== */
        function filtrar() {
            const texto = document.getElementById("search").value.toLowerCase();
            const categoria = document.getElementById("categoryFilter").value;

            const filtrados = restaurantes.filter(r =>
                r.nombre.toLowerCase().includes(texto) &&
                (categoria === "" || r.categoria === categoria)
            );

            renderLista(filtrados);
            cargarMarcadores(filtrados);
        }

        document.getElementById("search").addEventListener("input", filtrar);
        document.getElementById("categoryFilter").addEventListener("change", filtrar);

        /* ==========================
           5. GEOLOCALIZACIÓN
           ========================== */
        let userMarker = null;

        document.getElementById("locateBtn").addEventListener("click", () => {
            if (!navigator.geolocation) {
                alert("Tu navegador no soporta geolocalización");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;

                    if (userMarker) map.removeLayer(userMarker);

                    userMarker = L.marker([lat, lng]).addTo(map)
                        .bindPopup("📍 Estás aquí");

                    map.setView([lat, lng], 15);
                    userMarker.openPopup();
                },
                () => alert("No se pudo obtener tu ubicación")
            );
        });
    </script>
</body>
</html>
