<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mapa de Restaurantes</title>

    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- Estilos propios -->
    <style>
        body { margin: 0; display: flex; }

        /* Panel lateral */
        #sidebar {
            width: 300px;
            background: #fafafa;
            padding: 20px;
            border-right: 1px solid #ddd;
            font-family: sans-serif;
        }
        #sidebar h2 { margin-top: 0; }
        .restaurant-item {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .restaurant-item:hover {
            background: #eee;
        }

        /* Mapa */
        #map {
            flex-grow: 1;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- PANEL LATERAL -->
    <div id="sidebar">
        <h2>Restaurantes</h2>

        <input type="text" id="search" placeholder="Buscar por nombre..." style="width:100%; margin-bottom: 10px;">

        <select id="categoryFilter" style="width:100%; margin-bottom: 15px;">
            <option value="">Todas</option>
            <option value="pizza">Pizza</option>
            <option value="japonesa">Japonesa</option>
            <option value="tapas">Tapas</option>
            <option value="hamburguesas">Hamburguesas</option>
        </select>

        <div id="restaurantList"></div>
    </div>

    <!-- MAPA -->
    <div id="map"></div>

    <!-- JS de Leaflet -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Script principal -->
    <script>

        /* ==========================
           1. DATOS DE RESTAURANTES
           ========================== */
        const restaurantes = [
            {
                id: 1,
                nombre: "Pizzería Don Luca",
                categoria: "pizza",
                descripcion: "Auténtica pizza napolitana.",
                coords: [40.4167, -3.70325]
            },
            {
                id: 2,
                nombre: "Sakura Sushi",
                categoria: "japonesa",
                descripcion: "Sushi fresco y ramen casero.",
                coords: [40.4183, -3.70577]
            },
            {
                id: 3,
                nombre: "Bar La Esquina",
                categoria: "tapas",
                descripcion: "Tapas tradicionales españolas.",
                coords: [40.4155, -3.7074]
            },
            {
                id: 4,
                nombre: "Burger House",
                categoria: "hamburguesas",
                descripcion: "Hamburguesas gourmet.",
                coords: [40.4178, -3.7025]
            }
        ];

        /* ==========================
           2. INICIALIZAR MAPA
           ========================== */
        const map = L.map("map").setView([40.4167, -3.70325], 14);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap"
        }).addTo(map);

        const markers = {};

        function cargarMarcadores(lista) {
            Object.values(markers).forEach(m => map.removeLayer(m));
            lista.forEach(rest => {
                const marker = L.marker(rest.coords).addTo(map);
                marker.bindPopup(`
                    <b>${rest.nombre}</b><br>
                    <i>${rest.categoria}</i><br>
                    ${rest.descripcion}
                `);
                markers[rest.id] = marker;
            });
        }

        cargarMarcadores(restaurantes);

        /* ==========================
           3. PANEL LATERAL
           ========================== */
        const listEl = document.getElementById("restaurantList");

        function renderLista(lista) {
            listEl.innerHTML = "";
            lista.forEach(rest => {
                const div = document.createElement("div");
                div.className = "restaurant-item";
                div.textContent = `${rest.nombre} (${rest.categoria})`;

                div.onclick = () => {
                    map.setView(rest.coords, 17);
                    markers[rest.id].openPopup();
                };

                listEl.appendChild(div);
            });
        }

        renderLista(restaurantes);

        /* ==========================
           4. FILTROS
           ========================== */
        function filtrar() {
            const texto = document.getElementById("search").value.toLowerCase();
            const categoria = document.getElementById("categoryFilter").value;

            const filtrados = restaurantes.filter(r =>
                r.nombre.toLowerCase().includes(texto) &&
                (categoria === "" || r.categoria === categoria)
            );

            renderLista(filtrados);
            cargarMarcadores(filtrados);
        }

        document.getElementById("search").addEventListener("input", filtrar);
        document.getElementById("categoryFilter").addEventListener("change", filtrar);

    </script>
</body>
</html>
